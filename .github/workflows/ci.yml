name: CI Pipeline

# Trigger workflow on push and pull requests targeting main (or master) branch
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Supplementary Job: Linting before testing
  lint:
    name: Lint Code (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run code linter
        run: npm run lint

  # Core Job: Build and Automated Testing
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [lint] # Ensures lint passes before running tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run automated test suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-secret-key-for-testing
